# =============================================================================
# GC-SW-02 —— agent harness 起步配置黄金用例（业务线①软件生产）
# 由「契约驱动重生成」方法论升格；设计说明见 docs/golden-cases.md
# =============================================================================
id: GC-SW-02
title: 学情诊断内核——契约驱动盲重生成（重写者禁读原实现）
business_line: "①软件生产（spec+eval 资产化：spec 可稳定再生可工作的软件）"
business_line_code: SW
tier: B
tier_rationale: 执行线但有强纪律约束（隔离/禁读/双轮判定）；不需要决策，需要纪律服从
golden: true                   # 黄金用例：第一版 harness 必须过

source:
  - "docs/TASK-REGISTRY.md §3.3（R3 xuexing-agent：契约驱动重生成方法论=「原型即 oracle→冻结契约→盲重写→判定」，S-执行子代理只读规格、不继承原实现上下文=手册「子代理默认不继承」的自发实践）"
  - "audit/notes/project-xuexing-agent.md §5（考古当场实跑：pytest 709 passed / 0 failed + 知识库校验 VALIDATION OK + 契约测试全绿，三件全 exit 0）"
  - "zcode-sessions-export/INDEX.md 工作区「D:/workspace/学情agent」（1 主会话/160 子会话；主会话 20260928-1828_13:11 配额重置后恢复夜间迭代）"
  - "audit2/cap/sim-pilot.md §3.3（同型盲态纪律在 sim-pilot T1 实测成立：零上下文会话对非教学资产 leaks=[]）"

input:
  task_description: |
    学情诊断 Agent 内核已完成（709 测试全绿）。现在对其中某个已冻结契约（specs/frozen 16 份之一）
    的实现模块做一次「盲重生成」：新会话只拿到冻结 spec + 冻结测试，重写该模块全部实现，
    不看任何原实现代码。产出以自带契约测试判定，连续两轮 100% 才算过。
  input_materials: |
    - specs/frozen/ 对应模块契约（自含，不引用实现细节）
    - tests/contract/ 冻结契约测试
    - 独立隔离工作目录（禁看原实现的物理保证）

context_assets:
  - 任务书：docs/TASK-REGISTRY.md §3.3 委托执行要点（禁止=让重写者看原实现）
  - 验收基线：pytest 709 passed + tools/validate_knowledge.py VALIDATION OK + tools/run_contract.py 全绿（考古三件全 exit 0）
  - 隔离纪律先例：chenmai8 _regen/×10、_regen2/×8 盲实现试点（project-chenmai8.md §2.5）

expected_behavior:
  steps:
    - "S-契约：冻结 spec，人审通过后不再改动"
    - "S-执行（重写者）：新会话只读 spec+冻结测试，在隔离目录盲写实现；发现 spec 矛盾时上报缺陷而不是自行猜测语义"
    - "S-验收：跑 run_contract.py 判定，连续两轮 100% 才通过；任一轮不过=打回，附失败用例清单"
    - "重生成完成后跑全量 pytest 确认零回归"
  red_lines:
    - "重写者禁读原实现（防抄袭式重生成）——这是「spec 可再生」主张成立的前提"
    - "上游材料（spec/测试）缺失或为空时 fail-closed：上报缺陷、停止执行，不得自行补写臆造（sim-pilot round1 空产物实测：agent 应拒绝臆造并退回上游）"
    - "禁止通过修改契约/测试来让重生成通过（改契约=新版本+留痕+owner 知悉）"

acceptance:
  - assert: "契约判定连续两轮 100%"
    how: "tools/run_contract.py 两次独立执行均 exit 0 且全用例通过；两次执行输出可对账（无时间戳口径）"
  - assert: "全量零回归"
    how: "python -m pytest → 709 passed / 0 failed（基线 project-xuexing-agent.md §5 当场实跑口径）"
  - assert: "隔离纪律可核"
    how: "重写会话的输入清单/访问日志中无原实现路径命中；隔离目录外零写入"
  - assert: "知识库完整性"
    how: "tools/validate_knowledge.py → VALIDATION OK（189 kps/810 题/343 误解 量级不回退）"

notes: |
  这是业务线①「软件=spec+eval 的可再生产物」的最小完整闭环（输入组装→盲实现→独立判定→
  双轮收敛），且每个判定机器可查。它与 GC-GOV-06（输入组装时序）共用同一失败模式防线：
  上游产物为空必须显式失败而不是静默传空。
